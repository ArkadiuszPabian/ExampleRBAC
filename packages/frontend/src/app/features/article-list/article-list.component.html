<section class="grid articles">
  <article *ngFor="let article of articles">
    <header>{{ article.title }}</header>
    <p *ngIf="article.author">
      <small>by {{ article.author }}</small>
    </p>
    <p *ngIf="article.isPublished">🚀 Published</p>
    <p class="content">{{ article.content }}</p>
    <footer>
      <div class="grid">
        <button
          *appHasPermission="'update:articles'"
          (click)="editArticle(article.id)"
        >
          Edit
        </button>
        <button
          *appHasPermission="'delete:articles'"
          (click)="deleteArticle(article.id)"
        >
          Delete
        </button>
      </div>
    </footer>
  </article>
</section>

<button
  *appHasPermission="'create:articles'"
  id="create-new-article"
  class="mb-8"
  (click)="createNewArticle()"
>
  Create new article
</button>
