<article [attr.aria-busy]="isLoading">
  <h2>Roles</h2>

  <details
    name="role"
    *ngFor="let role of roles"
    (toggle)="fetchPermissions(role.id)"
  >
    <summary role="button" class="outline">{{ role.roleName }}</summary>

    <div [attr.aria-busy]="loadingPermissions.has(role.id)">
      <div *ngIf="permissionsMap.get(role.id) as permissions" class="gap">
        <button
          class="outline secondary"
          *ngFor="let permission of permissions"
        >
          {{ permission.permissionName }}
        </button>
        <hr *ngIf="permissions.length > 0" />

        <div class="grid">
          <button
            *appHasPermission="'update:roles'"
            (click)="editRole(role.id)"
          >
            Edit
          </button>
          <button
            *appHasPermission="'delete:roles'"
            (click)="deleteRole(role.id)"
          >
            Delete
          </button>
        </div>
      </div>
    </div>
  </details>
</article>

<button
  *appHasPermission="'create:roles'"
  class="mb-8"
  (click)="createNewRole()"
>
  Create new role
</button>
