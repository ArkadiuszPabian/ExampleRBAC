<section class="grid users">
  <article *ngFor="let user of users">
    <header>
      <div class="title">
        <strong>{{ user.username }}</strong>
        <small *ngIf="user.deletedAt !== null">❌ Deleted</small>
      </div>
      <small *ngIf="user.isActivated">✔️ Activated</small>
      <small *ngIf="!user.isActivated">❌ Deactivated</small>
    </header>

    <dl>
      <dt>Role</dt>
      <dd>{{ user.roleName }}</dd>
      <dt>Password</dt>
      <dd>*****</dd>
    </dl>

    <footer>
      <div class="grid">
        <button
          *appHasPermission="'update:users'"
          [disabled]="user.id === currentUserId || user.deletedAt !== null"
          (click)="editUser(user.id)"
        >
          Edit
        </button>
        <button
          *appHasPermission="'delete:users'"
          [disabled]="user.id === currentUserId || user.deletedAt !== null"
          (click)="deleteUser(user.id)"
        >
          Delete
        </button>
      </div>
    </footer>
  </article>
</section>

<button
  *appHasPermission="'create:users'"
  class="mb-8"
  (click)="createNewUser()"
>
  Create new user
</button>
