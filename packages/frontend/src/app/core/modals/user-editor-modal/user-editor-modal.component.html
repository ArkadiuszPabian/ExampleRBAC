<dialog open>
  <article [attr.aria-busy]="isLoading">
    <h5>{{ title }}</h5>
    <form *ngIf="form" [formGroup]="form">
      <label>
        Username
        <input
          formControlName="username"
          [readonly]="isEditing"
          appAutofocusAfterInit
        />
      </label>
      <p *ngIf="isEditing === true">
        <label>
          <input type="checkbox" formControlName="passwordFieldEnabled" />
          Edit password
        </label>
        <input type="password" formControlName="password" />
      </p>
      <label *ngIf="isEditing === false">
        Password
        <input type="password" formControlName="password" />
      </label>
      <label>
        Role
        <select formControlName="roleId" required>
          <option *ngFor="let role of roles" [value]="role.id">
            {{ role.roleName }}
          </option>
        </select>
      </label>
      <p>
        <label>
          <input formControlName="isActivated" type="checkbox" />
          Is activated
        </label>
      </p>
    </form>
    <footer>
      <button id="btn-cancel" (click)="cancel()">Cancel</button>
      <button id="btn-save" (click)="save()" [disabled]="form && form.invalid">
        Save
      </button>
    </footer>
  </article>
</dialog>
