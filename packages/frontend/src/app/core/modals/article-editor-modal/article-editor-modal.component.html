<dialog open>
  <article [attr.aria-busy]="isLoading">
    <h5>{{ title }}</h5>
    <form *ngIf="form" [formGroup]="form">
      <label>
        Title
        <input
          formControlName="title"
          type="text"
          placeholder="Title"
          [attr.aria-invalid]="isTitleInvalid"
          appAutofocusAfterInit
        />
      </label>
      <p>
        <label>
          <input formControlName="isPublished" type="checkbox" />
          Is published
        </label>
      </p>
      <label>
        Content
        <textarea formControlName="content" placeholder="Content"></textarea>
      </label>
    </form>
    <footer>
      <button (click)="cancel()">Cancel</button>
      <button (click)="save()" [disabled]="form && form.invalid">Save</button>
    </footer>
  </article>
</dialog>
