<header>
  <nav>
    <ul>
      <li>
        <a [routerLink]="''">
          <h1>RBAC Example Demo</h1>
          <span>Presentation of the RBAC permission system on live demo</span>
        </a>
      </li>
      <li></li>
    </ul>
    <ul>
      <li>
        <details
          id="profile-menu"
          #detailsRef
          class="dropdown"
          *appIsLoggedIn="true"
        >
          <summary role="button" class="outline">{{ loggedUser }}</summary>
          <ul dir="rtl">
            <li *appHasPermission="'view:roles'">
              <a id="nav-roles" (click)="navToRolesPage()">Edit roles</a>
            </li>
            <li *appHasPermission="'view:users'">
              <a id="nav-users" (click)="navToUsersPage()">Edit users</a>
            </li>
            <li>
              <a
                id="nav-logout"
                (click)="signOut()"
                [attr.disabled]="!signOutMenuItemEnabled"
                >Sign Out</a
              >
            </li>
          </ul>
        </details>

        <button *appIsLoggedIn="false" (click)="navToSignIn()">Sign In</button>
      </li>
    </ul>
  </nav>
</header>
