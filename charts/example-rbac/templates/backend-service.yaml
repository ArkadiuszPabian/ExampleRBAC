apiVersion: v1
kind: Service
metadata:
  name: {{ include "example-rbac.backend.name" . }}
  labels:
    {{- include "example-rbac.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "example-rbac.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
