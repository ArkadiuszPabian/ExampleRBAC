apiVersion: v1
kind: Service
metadata:
  name: {{ include "example-rbac.frontend.name" . }}
  labels:
    {{- include "example-rbac.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "example-rbac.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
