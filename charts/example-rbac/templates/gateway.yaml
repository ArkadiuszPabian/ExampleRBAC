{{- if .Values.gateway.enabled }}
{{- if .Values.ingress.enabled }}
{{- fail "gateway.enabled and ingress.enabled are mutually exclusive" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "example-rbac.fullname" . }}
  labels:
    {{- include "example-rbac.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className is required" .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ include "example-rbac.hostname" . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ include "example-rbac.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "example-rbac.fullname" . }}
  labels:
    {{- include "example-rbac.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "example-rbac.fullname" . }}
  hostnames:
    - {{ include "example-rbac.hostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "example-rbac.backend.name" . }}
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "example-rbac.frontend.name" . }}
          port: 80
{{- end }}
