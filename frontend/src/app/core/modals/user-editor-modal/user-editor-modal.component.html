<dialog open>
  <article [attr.aria-busy]="isLoading">
    <h5>{{ title }}</h5>
    <form *ngIf="form" [formGroup]="form">
      <label>
        Username
        <input
          formControlName="username"
          [readonly]="!!id"
          appAutofocusAfterInit
        />
      </label>
      <label>
        Role
        <select formControlName="roleId" required>
          <option selected disabled value="-1">Select role...</option>
          <option *ngFor="let role of roles" [value]="role.id">
            {{ role.roleName }}
          </option>
        </select>
      </label>
      <p>
        <label>
          <input formControlName="isActivated" type="checkbox" />
          Is activated
        </label>
      </p>
    </form>
    <footer>
      <button (click)="cancel()">Cancel</button>
      <button (click)="save()" [disabled]="form && form.invalid">Save</button>
    </footer>
  </article>
</dialog>
