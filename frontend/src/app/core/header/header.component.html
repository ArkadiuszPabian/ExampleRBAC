<header>
  <nav>
    <ul>
      <li>
        <a [routerLink]="''">
          <h1>RBAC Example Demo</h1>
          <span>Presentation of the RBAC permission system on live demo</span>
        </a>
      </li>
      <li></li>
    </ul>
    <ul>
      <li>
        <details #detailsRef class="dropdown" *appIsLoggedIn="true">
          <summary role="button" class="outline">{{ loggedUser }}</summary>
          <ul dir="rtl">
            <li>
              <a *appHasPermission="'view:roles'" (click)="navToRolesPage()"
                >Edit roles</a
              >
            </li>
            <li>
              <a *appHasPermission="'view:users'" (click)="navToUsersPage()"
                >Edit users</a
              >
            </li>
            <li><a (click)="signOut()">Sign Out</a></li>
          </ul>
        </details>

        <button *appIsLoggedIn="false" (click)="navToSignIn()">Sign In</button>
      </li>
    </ul>
  </nav>
</header>
